name: 🚀 Onboard New PixelUp Client

on:
  workflow_dispatch:
    inputs:
      client_name:
        description: "Client Name (lowercase, hyphens allowed)"
        required: true
        type: string
      custom_domain:
        description: "Custom Domain (optional)"
        required: false
        type: string
      store_name:
        description: "Store Display Name (optional)"
        required: false
        type: string
      phone_number:
        description: "WhatsApp Phone Number (optional)"
        required: false
        type: string

jobs:
  onboard:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: 🔧 Upgrade npm to 9.8.1
        run: npm install -g npm@9.8.1
          
      - name: 📦 Install Dependencies
        run: |
          npm ci || npm install
          
      - name: ✅ Validate Client Name
        run: |
          CLIENT_NAME="${{ github.event.inputs.client_name }}"
          if [[ ! "$CLIENT_NAME" =~ ^[a-z0-9-]+$ ]]; then
            echo "❌ Error: Client name must contain only lowercase letters, numbers, and hyphens"
            exit 1
          fi
          echo "✅ Client name validation passed: $CLIENT_NAME"
          
      - name: 🏗️ Create Environment Template
        run: |
          cat > .env.local << EOF
          NEXT_PUBLIC_API_URL_BO_CLIENTE=https://pixelup-customer-backoffice-api-git-de-80bd27-pixelups-projects.vercel.app
          NEXT_PUBLIC_API_URL_CLIENTE=https://pixelup-ecommerce-api-git-development-pixelups-projects.vercel.app
          API_AUTH_TOKEN=${{ secrets.API_AUTH_TOKEN }}
          VERCEL_TOKEN=${{ secrets.VERCEL_TOKEN }}
          GITHUB_REPOSITORY=${{ github.repository }}
          EOF
          
      - name: 🚀 Run Client Onboarding
        run: node scripts/onboard.js ${{ github.event.inputs.client_name }}
        env:
          API_AUTH_TOKEN: ${{ secrets.API_AUTH_TOKEN }}
          SITE_API_URL: ${{ secrets.SITE_API_URL }}
          BANNERS_API_URL: ${{ secrets.BANNERS_API_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_DOMAIN: ${{ github.event.inputs.custom_domain }}
          STORE_NAME: ${{ github.event.inputs.store_name }}
          PHONE_NUMBER: ${{ github.event.inputs.phone_number }}
          
      - name: 📄 Create Deployment Summary
        run: |
          CLIENT_NAME="${{ github.event.inputs.client_name }}"
          echo "## 🎉 Client Onboarding Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Client Name:** $CLIENT_NAME" >> $GITHUB_STEP_SUMMARY
          echo "- **Expected URL:** https://$CLIENT_NAME.vercel.app" >> $GITHUB_STEP_SUMMARY
          echo "- **Components Generated:** 50+" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment Variables:** Automatically configured" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Quick Links" >> $GITHUB_STEP_SUMMARY
          echo "- [View Site](https://$CLIENT_NAME.vercel.app)" >> $GITHUB_STEP_SUMMARY
          echo "- [Vercel Dashboard](https://vercel.com/dashboard)" >> $GITHUB_STEP_SUMMARY
          echo "- [Configuration Files](https://github.com/${{ github.repository }}/tree/main/scripts/automationDocs/backups)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. ✅ Verify deployment at the provided URL" >> $GITHUB_STEP_SUMMARY
          echo "2. 🌐 Configure custom domain in Vercel (if needed)" >> $GITHUB_STEP_SUMMARY
          echo "3. 📝 Update client-specific content through admin panel" >> $GITHUB_STEP_SUMMARY
          echo "4. 🧪 Test all components and functionality" >> $GITHUB_STEP_SUMMARY
          
      - name: 📧 Notify on Success
        if: success()
        run: |
          echo "✅ Client onboarding completed successfully!"
          echo "🔗 Site URL: https://${{ github.event.inputs.client_name }}.vercel.app"
          
      - name: 🚨 Notify on Failure
        if: failure()
        run: |
          echo "❌ Client onboarding failed!"
          echo "Please check the logs above for details."
          
      - name: 📦 Archive Generation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-onboarding-${{ github.event.inputs.client_name }}
          path: |
            .env.local
            scripts/automationDocs/backups/${{ github.event.inputs.client_name }}-*
          retention-days: 30
